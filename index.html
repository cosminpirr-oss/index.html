<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vizualizare Bubble Sort</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>Bubble Sort Visualizer</h1>
        <p>
          Generează un șir de 5 numere și urmărește fiecare pas din algoritmul
          Bubble Sort.
        </p>
      </section>

      <section class="controls">
        <button id="generate-btn" type="button">Generează array</button>
        <button id="sort-btn" type="button">Sortează</button>
      </section>

      <section class="visualizer">
        <div class="panel">
          <h2>Array inițial</h2>
          <div id="starting-array" class="array-row"></div>
        </div>

        <div class="panel">
          <h2>Pașii sortării</h2>
          <div id="array-container" class="steps-container">
            <div class="placeholder">Apasă pe „Generează array” pentru a începe.</div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
